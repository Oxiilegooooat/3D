[project]
name = "maquette"
version = "0.1.0"
description = "Maquettes 3D des sites étudiés, à partir de l'open data IGN (BD TOPO, cadastre, ortho, LiDAR HD)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "pillow>=10.4",
    "pyproj>=3.8.0",
    "pyyaml>=6.0",
    "scikit-image>=0.26.0",
    "scipy>=1.14",
    "shapely>=2.0",
    "triangle>=20250106",
    "typer>=0.12",
]

[project.scripts]
maquette = "maquette.cli:app"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.3", "ruff>=0.6", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["blender/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
